[package]
name = "jade-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
pure-rust-curves = [
    "dep:aes",
    "dep:base58ck",
    "dep:bech32",
    "dep:bip32",
    "dep:k256",
    "dep:p256",
    "dep:ripemd",
]
liquid-elements-ffi = ["dep:elements"]

[dependencies]
aes = { workspace = true, optional = true }
base58ck = { workspace = true, optional = true }
bech32 = { workspace = true, optional = true }
bip32 = { workspace = true, optional = true }
elements = { workspace = true, optional = true }
hmac.workspace = true
k256 = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
pbkdf2.workspace = true
ripemd = { workspace = true, optional = true }
sha1.workspace = true
sha2.workspace = true
zeroize.workspace = true

[dev-dependencies]
bip39 = { workspace = true, features = ["alloc"] }
