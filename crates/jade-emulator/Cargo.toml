[package]
name = "jade-emulator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = ["minicbor/std"]

[dependencies]
base58ck.workspace = true
bip39 = { workspace = true, features = ["alloc"] }
jade-core.workspace = true
jade-crypto = { workspace = true, features = ["pure-rust-curves"] }
jade-protocol-v1.workspace = true
jade-protocol-v2.workspace = true
jade-storage.workspace = true
minicbor.workspace = true
sha2.workspace = true
