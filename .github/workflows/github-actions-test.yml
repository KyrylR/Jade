name: GitHub Actions test
on: [push]
jobs:
  rust_core:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v5
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Check Rust workspace formatting
      run: cargo fmt --all --check
    - name: Check Rust workspace
      run: cargo check --workspace --all-targets
    - name: Test Rust workspace
      run: cargo test --workspace
    - name: Clippy Rust workspace
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build_v1_1:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'
    - name: build Jade 1.1
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.4
        target: esp32
        command: ./tools/switch_to.sh jade_v1_1 --dev --log && idf.py size all

  build_v2:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'
    - name: build Jade Plus
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.4
        target: esp32s3
        command: ./tools/switch_to.sh jade_v2 --dev --log --jtag && idf.py size all

  build_v2c:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'
    - name: build Jade Core
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.4
        target: esp32s3
        command: ./tools/switch_to.sh jade_v2c --dev --log --jtag && idf.py size all
